[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buyer-value-radar"
version = "0.1.0"
description = "A two-curve model that predicts how much each repeat buyer will spend over the next 6 and 12 months, built on real wholesale transaction data."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# boto3 is only imported (never called) by tests/test_score_parity.py, which
# loads aws-lambda/score.py to check it against bvr.predictive/retransform --
# it is not a runtime dependency of the bvr package itself.
dev = ["pytest>=8.0", "ruff>=0.4", "boto3>=1.28"]

[project.scripts]
bvr = "bvr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
